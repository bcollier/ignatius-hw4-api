# Weekly pull requests for newer versions of the server's packages (requirements.txt).
# After merging one, refresh the lock: uv pip compile requirements.txt --generate-hashes
# --python-version 3.12 -o requirements.lock
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
